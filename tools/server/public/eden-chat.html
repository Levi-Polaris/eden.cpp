<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eden Chat</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --dim: #8b949e;
  --accent: #7c3aed;
  --accent-glow: #a78bfa;
  --user-bubble: #1a1a2e;
  --assistant-bubble: #0d1117;
  --error: #f85149;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; height: 100vh;
  font-size: 14px; line-height: 1.6;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.logo { font-weight: 700; font-size: 16px; color: var(--accent-glow); }
.model-badge {
  font-size: 11px; background: var(--accent); color: #fff;
  padding: 3px 8px; border-radius: 10px; font-weight: 500;
}
.vram { font-size: 11px; color: var(--dim); margin-left: auto; }
#chat {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.msg {
  max-width: 85%; padding: 10px 14px; border-radius: 12px;
  animation: fadeIn 0.2s ease;
}
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
.msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
.msg.error { align-self: flex-start; background: #3d1111; border: 1px solid var(--error); color: var(--error); }
.msg .tokens { font-size: 10px; color: var(--dim); margin-top: 4px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
footer {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 16px; display: flex; gap: 8px; flex-shrink: 0;
}
#input {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 10px 14px; border-radius: 8px;
  font-size: 14px; font-family: inherit; resize: none;
  min-height: 42px; max-height: 200px;
}
#input:focus { outline: none; border-color: var(--accent); }
#send {
  background: var(--accent); color: #fff; border: none;
  padding: 10px 20px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 600;
}
#send:hover { background: var(--accent-glow); }
#send:disabled { opacity: 0.5; cursor: default; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--dim); border-top-color: var(--accent-glow); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.status { font-size: 11px; color: var(--dim); padding: 4px 16px; text-align: center; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <span class="logo">🌱 Eden</span>
  <span class="model-badge" id="model-name">loading...</span>
  <span class="vram" id="vram">—</span>
</header>

<div id="chat">
  <div class="msg assistant">
    Welcome to <b>Eden Chat</b>. This is a local model running on your machine through eden-server.<br><br>
    Type anything. Everything stays on your hardware.
  </div>
</div>

<div class="status" id="status"></div>

<footer>
  <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="send" onclick="send()">Send</button>
</footer>

<script>
const API = '/v1/chat/completions';
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
let modelName = 'unknown';

async function init() {
  try {
    const r = await fetch('/v1/models');
    const d = await r.json();
    if (d.models?.[0]?.name) {
      modelName = d.models[0].name.replace('.gguf','');
      document.getElementById('model-name').textContent = modelName;
    }
  } catch(e) { document.getElementById('model-name').textContent = 'local model'; }
  try {
    const r = await fetch('/health');
    if (r.ok) document.getElementById('vram').textContent = '● online';
  } catch(e) { document.getElementById('vram').textContent = '○ offline'; }
}

function addMsg(role, text, tokens) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = text.replace(/\n/g, '<br>');
  if (tokens) div.innerHTML += `<div class="tokens">${tokens}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

let conversation = [];

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span> thinking...';

  conversation.push({ role: 'user', content: msg });
  addMsg('user', escapeHtml(msg));

  const assistantDiv = addMsg('assistant', '<span class="spinner"></span>', '');

  try {
    // Keep last 20 messages (sliding window)
    const history = conversation.slice(-20);
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history,
        max_tokens: 768,
        stream: false
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const assistantMsg = data.choices?.[0]?.message || {};
    let content = assistantMsg.content || assistantMsg.reasoning_content || '(empty response)';
    // Strip <think> tags from Qwen thinking models
    content = content.replace(/<think>[\s\S]*?<\/think>/gi, '').trim() || content;
    conversation.push({ role: 'assistant', content: content });
    const tokens = data.usage
      ? `${data.usage.prompt_tokens}↑ ${data.usage.completion_tokens}↓ ${data.usage.total_tokens} total`
      : '';

    assistantDiv.innerHTML = content.replace(/\n/g, '<br>');
    if (tokens) assistantDiv.innerHTML += `<div class="tokens">${tokens}</div>`;
    statusEl.textContent = '';

  } catch(e) {
    assistantDiv.className = 'msg error';
    assistantDiv.textContent = 'Error: ' + e.message;
    statusEl.textContent = '';
  }

  sendBtn.disabled = false;
  input.focus();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});

init();
</script>
</body>
</html>
